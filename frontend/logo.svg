<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Main gradient -->
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff41"/>
      <stop offset="50%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#00ff41"/>
    </linearGradient>
    <!-- Glow effect -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Shield clip path -->
    <clipPath id="shieldClip">
      <path d="M32 4 L56 14 L56 32 C56 46 44 56 32 60 C20 56 8 46 8 32 L8 14 Z"/>
    </clipPath>
  </defs>
  
  <!-- Outer glow ring -->
  <circle cx="32" cy="32" r="30" stroke="url(#mainGrad)" stroke-width="1" fill="none" opacity="0.3"/>
  
  <!-- Shield background -->
  <path d="M32 6 L54 15 L54 32 C54 44.5 43 54 32 58 C21 54 10 44.5 10 32 L10 15 Z" 
        fill="#0d1117" stroke="url(#mainGrad)" stroke-width="2" filter="url(#glow)"/>
  
  <!-- Inner shield accent -->
  <path d="M32 12 L48 19 L48 32 C48 41 40 48 32 51 C24 48 16 41 16 32 L16 19 Z" 
        fill="none" stroke="url(#mainGrad)" stroke-width="1" opacity="0.4"/>
  
  <!-- Lock body -->
  <rect x="24" y="30" width="16" height="14" rx="3" fill="url(#mainGrad)" filter="url(#glow)"/>
  
  <!-- Lock shackle -->
  <path d="M27 30 L27 25 C27 21 29.5 19 32 19 C34.5 19 37 21 37 25 L37 30" 
        fill="none" stroke="url(#mainGrad)" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- Keyhole -->
  <circle cx="32" cy="35" r="2.5" fill="#0d1117"/>
  <rect x="30.5" y="35" width="3" height="5" rx="1" fill="#0d1117"/>
  
  <!-- Digital accent lines -->
  <g opacity="0.6" stroke="url(#mainGrad)" stroke-width="1">
    <line x1="14" y1="24" x2="20" y2="24"/>
    <line x1="44" y1="24" x2="50" y2="24"/>
    <line x1="14" y1="40" x2="18" y2="40"/>
    <line x1="46" y1="40" x2="50" y2="40"/>
  </g>
  
  <!-- Corner accents -->
  <g fill="url(#mainGrad)" opacity="0.8">
    <circle cx="14" cy="24" r="1.5"/>
    <circle cx="50" cy="24" r="1.5"/>
    <circle cx="14" cy="40" r="1.5"/>
    <circle cx="50" cy="40" r="1.5"/>
  </g>
</svg>
