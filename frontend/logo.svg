<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="irisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff41"/>
      <stop offset="50%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#00ff41"/>
    </linearGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ff41" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0.2"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Eye outer shape -->
  <path d="M4 32 C14 14, 50 14, 60 32 C50 50, 14 50, 4 32 Z" 
        fill="#0a0f1a" stroke="url(#irisGrad)" stroke-width="2.5" filter="url(#glow)"/>
  
  <!-- Eyeball white -->
  <ellipse cx="32" cy="32" rx="18" ry="14" fill="#e0e8f0" opacity="0.95"/>
  
  <!-- Iris outer -->
  <circle cx="32" cy="32" r="12" fill="url(#eyeGlow)" filter="url(#glow)"/>
  
  <!-- Iris detail lines -->
  <g stroke="#00ff41" stroke-width="0.7" opacity="0.5">
    <line x1="32" y1="20" x2="32" y2="26"/>
    <line x1="32" y1="38" x2="32" y2="44"/>
    <line x1="20" y1="32" x2="26" y2="32"/>
    <line x1="38" y1="32" x2="44" y2="32"/>
    <line x1="24" y1="24" x2="28" y2="28"/>
    <line x1="36" y1="36" x2="40" y2="40"/>
    <line x1="40" y1="24" x2="36" y2="28"/>
    <line x1="24" y1="40" x2="28" y2="36"/>
  </g>
  
  <!-- Pupil -->
  <circle cx="32" cy="32" r="5" fill="#0a0f1a"/>
  
  <!-- Light reflection -->
  <ellipse cx="28" cy="28" rx="2.5" ry="2" fill="white" opacity="0.8"/>
  
  <!-- Forbidden diagonal line -->
  <line x1="10" y1="10" x2="54" y2="54" 
        stroke="url(#irisGrad)" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
</svg>
