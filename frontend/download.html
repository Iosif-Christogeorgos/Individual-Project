<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SecureZero - Download</title>
    <style>
      body {
        font-family: sans-serif;
        padding: 40px;
        text-align: center;
      }
      .card {
        max-width: 500px;
        margin: 0 auto;
        border: 1px solid #ccc;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      }
      button {
        background: #007bff;
        color: white;
        border: none;
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
        border-radius: 4px;
      }
      button:disabled {
        background: #ccc;
      }
      #status {
        margin-top: 20px;
        color: #555;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>Secure File Download</h2>
      <p>This file is encrypted. Your browser will decrypt it locally.</p>
      <button id="btnDownload" onclick="startDownload()">
        Download & Decrypt
      </button>
      <div id="status"></div>
    </div>

    <script>
      async function startDownload() {
        const btn = document.getElementById("btnDownload");
        const status = document.getElementById("status");
        btn.disabled = true;

        try {
          // 1. Get Parameters from URL
          const urlParams = new URLSearchParams(window.location.search);
          const fileId = urlParams.get("id");
          const keyString = window.location.hash.substring(1); // Remove '#'

          if (!fileId || !keyString)
            throw new Error("Missing File ID or Key in URL.");

          status.innerText = "1. Fetching encrypted blob...";

          // 2. Download the Encrypted Blob
          const response = await fetch(`/download/${fileId}`);
          if (!response.ok) throw new Error("File not found on server.");
          const encryptedBlob = await response.arrayBuffer();

          status.innerText += "\n2. Blob received! Importing key...";

          // 3. Import the Key (Convert Base64 string back to CryptoKey)
          const jwk = JSON.parse(atob(keyString));
          const key = await window.crypto.subtle.importKey(
            "jwk",
            jwk,
            { name: "AES-GCM" },
            true,
            ["encrypt", "decrypt"]
          );

          status.innerText += "\n3. Decrypting...";

          // 4. Split IV and Data
          // (We combined them during upload: First 12 bytes are IV, rest is Data)
          const iv = encryptedBlob.slice(0, 12);
          const data = encryptedBlob.slice(12);

          // 5. Decrypt
          const decryptedBuffer = await window.crypto.subtle.decrypt(
            { name: "AES-GCM", iv: iv },
            key,
            data
          );

          status.innerText += "\n4. Success! Saving file...";

          // 6. Trigger Download
          const blob = new Blob([decryptedBuffer]);
          const downloadUrl = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = downloadUrl;
          a.download = `decrypted-file-${Date.now()}.bin`; // We don't know the original name (security feature!)
          document.body.appendChild(a);
          a.click();
        } catch (err) {
          console.error(err);
          status.innerText += "\n❌ Error: " + err.message;
          btn.disabled = false;
        }
      }
    </script>
  </body>
</html>
