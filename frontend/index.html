<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CrypShare - Client Side Encryption</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <h2>CrypShare: Zero-Knowledge Uploader</h2>
      <p>
        Select a file. It will be encrypted in your browser before uploading.
      </p>

      <input type="file" id="fileInput" />
      <br /><br />
      <button id="uploadBtn" onclick="processFile()">
        🔒 Encrypt & Upload
      </button>

      <!-- Progress Bar -->
      <div id="progress-container">
        <div id="progress-bar">
          <div id="progress-fill"></div>
        </div>
        <div id="progress-text">Starting...</div>
      </div>

      <!-- Share Link Result Box -->
      <div id="share-link-container">
        <h3>✅ Upload Complete! Share this link:</h3>
        <input type="text" id="share-link" readonly />
        <br />
        <button id="copy-btn" onclick="copyLink()">📋 Copy Link</button>
      </div>

      <h3>🔍 Debug Log:</h3>
      <pre id="debug-log">
[ CrypShare Debug Console ]\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━\nWaiting for file selection...</pre
      >
    </div>

    <script src="upload.js"></script>
  </body>
</html>
