<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="irisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff41"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ff41" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0.3"/>
    </radialGradient>
  </defs>
  
  <!-- Eye outer shape -->
  <path d="M2 16 C6 7, 26 7, 30 16 C26 25, 6 25, 2 16 Z" 
        fill="#0a0f1a" stroke="url(#irisGrad)" stroke-width="1.5"/>
  
  <!-- Eyeball white -->
  <ellipse cx="16" cy="16" rx="9" ry="7" fill="#e0e8f0" opacity="0.95"/>
  
  <!-- Iris -->
  <circle cx="16" cy="16" r="6" fill="url(#eyeGlow)"/>
  
  <!-- Iris lines -->
  <g stroke="#00ff41" stroke-width="0.5" opacity="0.4">
    <line x1="16" y1="10" x2="16" y2="13"/>
    <line x1="16" y1="19" x2="16" y2="22"/>
    <line x1="10" y1="16" x2="13" y2="16"/>
    <line x1="19" y1="16" x2="22" y2="16"/>
  </g>
  
  <!-- Pupil -->
  <circle cx="16" cy="16" r="2.5" fill="#0a0f1a"/>
  
  <!-- Light reflection -->
  <circle cx="14" cy="14" r="1.2" fill="white" opacity="0.8"/>
  
  <!-- Forbidden diagonal line -->
  <line x1="5" y1="5" x2="27" y2="27" 
        stroke="url(#irisGrad)" stroke-width="2.5" stroke-linecap="round"/>
</svg>
