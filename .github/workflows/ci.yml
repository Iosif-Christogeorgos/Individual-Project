name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check production dependencies for known vulnerabilities
        run: npm audit --omit=dev --audit-level=high

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t crypshare .
      - name: Check the server starts in the image
        run: |
          docker run -d --name crypshare -p 8080:8080 \
            -e SUPABASE_URL=http://localhost:1 \
            -e SUPABASE_SERVICE_ROLE_KEY=test \
            -e R2_ENDPOINT=http://localhost:1 \
            -e R2_ACCESS_KEY_ID=test \
            -e R2_SECRET_ACCESS_KEY=test \
            -e R2_BUCKET_NAME=test \
            crypshare
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8080/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs crypshare
          exit 1
